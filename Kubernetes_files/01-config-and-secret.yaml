# Лекција 10 / Chapter 11 — ConfigMaps и Secrets
# ConfigMap = неосетлива конфигурација.  Secret = лозинки/корисници.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: earthquake
data:
  POSTGRES_DB: earthquakedb
  # Backend-от се поврзува на базата преку DNS името на Service-от "postgres"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/earthquakedb
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: earthquake
type: Opaque
# stringData = пишуваш чист текст, Kubernetes сам го енкодира во base64.
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
