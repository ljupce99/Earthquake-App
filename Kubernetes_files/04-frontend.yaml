
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: earthquake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ljupcejovanov99580/earthquake-frontend:latest
          ports:
            - containerPort: 3005
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: earthquake
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3005
      targetPort: 3005
      nodePort: 30005
