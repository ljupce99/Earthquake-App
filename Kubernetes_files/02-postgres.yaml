# Лекција 10 / Chapter 10 (Storage) + Chapter 12 (StatefulSets)
# Базата е stateful → StatefulSet со свој постојан диск преку volumeClaimTemplates.
---
# Headless Service (clusterIP: None) — стандард за StatefulSet.
# Дава стабилно DNS име "postgres" преку кое backend-от се поврзува.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: earthquake
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: earthquake
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            # postgres сака празен поддиректориум за податоците
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # readiness probe = истото како healthcheck-от во compose
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
  # Секој Pod добива свој PVC (свој диск) — Chapter 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # Без storageClassName → се користи default StorageClass на кластерот.
        # Ако твојот кластер нема default, додади: storageClassName: <име>
